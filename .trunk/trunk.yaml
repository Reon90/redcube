# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
    version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
    sources:
        - id: trunk
          ref: v1.7.3
          uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
    enabled:
        - node@22.16.0
        - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
    enabled:
        - yamllint@1.37.1
        - checkov@3.2.490
        - markdownlint@0.45.0
        - osv-scanner@2.2.4
        - oxipng@9.1.5
        - prettier@3.6.2
        - trufflehog@3.90.12
    disabled:
        - git-diff-check
        - eslint
    ignore:
        # Generated build output - regenerated on every `npm run build`,
        # reformatting it is pointless and it'll drift again immediately.
        - linters: [prettier]
          paths:
              - dist/**
        # Vendored/third-party code we don't reformat (same reasoning as
        # oxlint's src/perlin.js exclusion) and a one-off, unreferenced
        # manual HDR-conversion utility script.
        - linters: [prettier]
          paths:
              - glslang.js
              - libktx.js
              - twgsl.js
              - webgl-memory.js
              - webgpu-memory.js
              - src/perlin.js
              - hdr.js
actions:
    disabled:
        - trunk-announce
        - trunk-check-pre-push
    enabled:
        - trunk-upgrade-available
        - trunk-fmt-pre-commit
