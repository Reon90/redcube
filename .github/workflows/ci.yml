name: CI

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - run: npm ci

            - run: npm run lint:check

            - run: npm test

            - run: npm run build

    trunk-check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
        steps:
            - uses: actions/checkout@v4
            - uses: trunk-io/trunk-action@v1
