<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>redcube.js — WebGL example</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #202020;
            }
            canvas {
                width: 100%;
                height: 100%;
                display: block;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>

        <!-- Built by `npm run build`; see ../../dist/redcube.js -->
        <script src="../../dist/redcube.js"></script>
        <script>
            const canvas = document.getElementById('canvas');
            const url =
                'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/DamagedHelmet/glTF/DamagedHelmet.gltf';

            // (url, canvas, processors, envUrl, mode)
            const model = new redcube.RedCube(url, canvas, [], '../../dist/env.hdr', 'pbr');

            model
                .init((scene) => {
                    console.log('Model loaded:', scene);
                })
                .catch((err) => {
                    console.error('Failed to load model:', err);
                });

            window.addEventListener('resize', () => model.redraw('resize'));
        </script>
    </body>
</html>
